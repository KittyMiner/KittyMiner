agents:
- name: QuantumOrchestrator
  domain: Quantum
  authority_scope: scoped
  purpose: "Evaluate quantum / hybrid solutions, simulation pathways, allocation strategies, and quantum-ready infrastructure."
  allowed_actions: [analyze, propose, draft_artifacts, request_review]
  restricted_actions: [production_deploy_without_gate, policy_override, cross-domain_reassignment_without_approval]
  output_route: [github_issue_or_pr, notion_card, governance_audit_log]
- name: SecurityScanner
