name: GAIA QF04 Cross-Host TCP Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gaia-qf04-xh-probe.yml"

concurrency:
  group: gaia-qf04-xh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  listener_vm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Launch isolated TCP listener
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          cat > runtime/listener.py <<'PY'
          import socket
          HOST = "0.0.0.0"
          PORT = 31247
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
              s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              s.bind((HOST, PORT))
              s.listen(8)
              print("LISTENING", flush=True)
              while True:
                  conn, addr = s.accept()
                  with conn:
                      data = conn.recv(4096)
                      if data == b"QF04-XH-PROBE":
                          conn.sendall(b"QF04-XH-ACK")
                          print(f"PEER_OK {addr[0]}:{addr[1]}", flush=True)
                          break
                      conn.sendall(b"DENY")
          PY
          RUNNER_TRACKING_ID="" nohup python runtime/listener.py >runtime/listener.log 2>&1 &
          echo $! > runtime/listener.pid
          for i in $(seq 1 20); do
            grep -q LISTENING runtime/listener.log && break
            sleep 1
          done
          grep -q LISTENING runtime/listener.log
          PUB_IP="$(curl -fsS --max-time 10 https://api.ipify.org)"
          PRIVATE_IPS="$(hostname -I | xargs)"
          MACHINE_ID="$(cat /etc/machine-id)"
          BOOT_ID="$(cat /proc/sys/kernel/random/boot_id)"
          python - "$PUB_IP" "$PRIVATE_IPS" "$MACHINE_ID" "$BOOT_ID" <<'PY'
          import json, os, socket, sys
          info = {
              "public_ip": sys.argv[1],
              "private_ips": [x for x in sys.argv[2].split() if x],
              "machine_id": sys.argv[3],
              "boot_id": sys.argv[4],
              "port": 31247,
              "hostname": socket.gethostname(),
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_os": os.environ.get("RUNNER_OS"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
          }
          open("runtime/listener_info.json","w").write(json.dumps(info, sort_keys=True))
          print(json.dumps(info, sort_keys=True))
          PY

      - name: Publish listener endpoint
        uses: actions/upload-artifact@v4
        with:
          name: qf04-xh-listener-info
          path: runtime/listener_info.json
          retention-days: 1

      - name: Await direct peer connection
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 150); do
            if grep -q PEER_OK runtime/listener.log; then
              cat runtime/listener.log
              exit 0
            fi
            sleep 1
          done
          cat runtime/listener.log
          exit 42

  client_vm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for listener endpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/info
          ART_ID=""
          for i in $(seq 1 120); do
            ART_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="qf04-xh-listener-info") | .id' | head -1 || true)"
            if [ -n "$ART_ID" ]; then break; fi
            sleep 2
          done
          test -n "$ART_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > runtime/info.zip
          unzip -q runtime/info.zip -d runtime/info
          cat runtime/info/listener_info.json

      - name: Attempt direct routed TCP connection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, socket, time, urllib.request
          info = json.load(open("runtime/info/listener_info.json"))
          with urllib.request.urlopen("https://api.ipify.org", timeout=10) as r:
              public_ip = r.read().decode().strip()
          local = {
              "hostname": socket.gethostname(),
              "runner_name": os.environ.get("RUNNER_NAME"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "public_ip": public_ip,
              "private_ips": socket.gethostbyname_ex(socket.gethostname())[2],
              "machine_id": open("/etc/machine-id").read().strip(),
              "boot_id": open("/proc/sys/kernel/random/boot_id").read().strip(),
          }
          independent = (
              local["machine_id"] != info["machine_id"]
              and local["boot_id"] != info["boot_id"]
              and local["runner_name"] != info["runner_name"]
          )
          targets = [("public", info["public_ip"])]
          targets.extend(("private", ip) for ip in info.get("private_ips", []))
          attempts = []
          if independent:
              for kind, host in targets:
                  for attempt in range(8):
                      try:
                          with socket.create_connection((host, int(info["port"])), timeout=3) as s:
                              s.sendall(b"QF04-XH-PROBE")
                              reply = s.recv(4096)
                              if reply != b"QF04-XH-ACK":
                                  raise RuntimeError(f"unexpected reply {reply!r}")
                              result = {
                                  "status": "PASS_INDEPENDENT_VM_DIRECT_TCP",
                                  "target_kind": kind,
                                  "target": host,
                                  "attempt": attempt + 1,
                                  "independent_vm": True,
                                  "listener": info,
                                  "client": local,
                                  "attempts": attempts,
                              }
                              open("runtime/client_result.json","w").write(json.dumps(result, sort_keys=True))
                              print(json.dumps(result, sort_keys=True))
                              raise SystemExit(0)
                      except Exception as exc:
                          attempts.append({"kind": kind, "host": host, "attempt": attempt + 1, "error": repr(exc)})
                          time.sleep(1)
          status = "HOLD_NOT_INDEPENDENT_VM" if not independent else "HOLD_DIRECT_TCP_UNREACHABLE"
          result = {
              "status": status,
              "independent_vm": independent,
              "listener": info,
              "client": local,
              "attempts": attempts,
          }
          open("runtime/client_result.json","w").write(json.dumps(result, sort_keys=True))
          print(json.dumps(result, sort_keys=True))
          raise SystemExit(44 if not independent else 43)
          PY

      - name: Publish client result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qf04-xh-client-result
          path: runtime/client_result.json
          if-no-files-found: error
          retention-days: 1
